<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <!-- Bootstrap CSS: ready-made styles and responsive grid -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Our own CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">
    <!-- container keeps content centered; py-5 adds vertical padding -->
    <div class="row g-3">

        <!-- Bento grid: large form area -->
        <div class="col-md-12 col-lg-12 col-sm-12">
            <div class="card p-4 h-100">
                <!-- card creates a box; p-4 adds padding -->

                <h2>Join the Class</h2>
                <p class="text-secondary">Create your student account.</p>

                <form id="registerForm">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control"
                               placeholder="Enter your name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control"
                               placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" id="phone" class="form-control"
                               placeholder="Enter your phone number">
                    </div>

                    <div class="row g-3">
                        <!-- row and col-md-6 put passwords side by side on wider screens -->
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input type="password" id="password"
                                   class="form-control" placeholder="Minimum 6 characters">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="confirmPassword"
                                   class="form-control" placeholder="Repeat password">
                        </div>
                    </div>

                    <div class="mt-3 mb-3">
                        <label class="form-label">Course</label>
                        <select id="course" class="form-select">
                            <option value="">Choose a course</option>
                            <option>Web Development</option>
                            <option>App Development</option>
                            <option>Graphic Design</option>
                            <option>Cyber Security</option>
                        </select>
                    </div>

                    <!-- JavaScript will display success/error messages here -->
                    <div id="message" class="mb-3" role="status"></div>

                    <button type="submit" class="btn btn-dark w-100">
                        Create Account
                    </button>
                    <!-- btn styles the button; w-100 makes it full width -->

                </form>
            </div>
        </div>

    </div>
</div>

<!-- Our JavaScript file -->
<script src="script.js"></script>
</body>
</html>
